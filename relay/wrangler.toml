name = "ccim-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true
routes = [{ pattern = "ccim.web3nomad.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Room", to = "Channel" }]

[[durable_objects.bindings]]
name = "AUTH"
class_name = "Auth"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Auth"]

# Remote MCP + OAuth. OAuth and the four ccim_* tools stay off until the OAUTH_ENC_KEY secret is set
# (32 random bytes, base64): `wrangler secret put OAUTH_ENC_KEY`.
[vars]
# 256 by default; 0 disables the no-human send limit.
LOOP_GUARD_MAX = "256"
OAUTH_ISSUER = "https://ccim.web3nomad.com"
MCP_ALLOWED_BINDINGS = "xd-bridge/xd-dot"
OAUTH_REDIRECT_HOSTS = "chatgpt.com"
